[desktop/app-folders]
folder-children=['System', 'Utilities', 'YaST', 'Pardus']

[desktop/app-folders/folders/Pardus]
categories=['X-Pardus-Apps']
name='X-Pardus-Apps.directory'
translate=true

[desktop/app-folders/folders/System]
apps=['org.gnome.baobab.desktop', 'org.gnome.DiskUtility.desktop', 'org.freedesktop.MalcontentControl.desktop', 'org.gnome.tweaks.desktop']
name='X-GNOME-Shell-System.directory'
translate=true

[desktop/app-folders/folders/Utilities]
apps=['org.gnome.Decibels.desktop', 'org.gnome.Papers.desktop', 'org.gnome.FileRoller.desktop', 'org.gnome.Loupe.desktop']
name='X-GNOME-Shell-Utilities.directory'
translate=true

[desktop/app-folders/folders/YaST]
categories=['X-SuSE-YaST']
name='suse-yast.directory'
translate=true

[desktop/datetime]
automatic-timezone=true

[desktop/input-sources]
sources=[('xkb', 'us')]

[desktop/interface]
accent-color='blue'
color-scheme='prefer-dark'
font-antialiasing='rgba'
font-hinting='medium'
gtk-theme='adw-gtk3-dark'
show-battery-percentage=true
toolkit-accessibility=false

[desktop/peripherals/keyboard]
numlock-state=true

[desktop/peripherals/pointingstick]
accel-profile='flat'
speed=0.52136752136752129

[desktop/peripherals/touchpad]
tap-to-click=true
two-finger-scrolling-enabled=true

[desktop/privacy]
remove-old-trash-files=true

[nautilus/preferences]
default-folder-viewer='icon-view'
migrated-gtk-settings=true

[settings-daemon/plugins/color]
night-light-enabled=false
night-light-schedule-automatic=false

